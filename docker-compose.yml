services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      minio-config:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql://pdfshare:pdfshare_password@pdfshare-db:5432/pdfshare
      DOMAIN: ${DOMAIN}
      NODE_ENV: production
      PORT: ${PORT:-3000}
      SESSION_SECRET: ${SESSION_SECRET:-change-me-in-production}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      APP_BASE_URL: ${APP_BASE_URL:-}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-465}
      MAIL_FAMILY: ${MAIL_FAMILY:-4}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SECURE: ${MAIL_SECURE:-true}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-PDFShare}
      MAIL_CONNECTION_TIMEOUT: ${MAIL_CONNECTION_TIMEOUT:-5000}
      MAIL_TIMEOUT: ${MAIL_TIMEOUT:-5000}
      MAIL_WRITE_TIMEOUT: ${MAIL_WRITE_TIMEOUT:-5000}
      MAIL_DEBUG: ${MAIL_DEBUG:-false}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_SSL: "false"
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      MINIO_BUCKET: ${MINIO_BUCKET:-uploads}
      ENABLE_TEST_LOGIN: "false"
    volumes:
      - app_logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:$${PORT:-3000}/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - pdfshare-net
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '10'

  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    image: pdfshare-postgres:14
    container_name: pdfshare-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: pdfshare
      POSTGRES_PASSWORD: pdfshare_password
      POSTGRES_DB: pdfshare
    volumes:
      - pdfshare_data_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pdfshare -d pdfshare"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - pdfshare-net
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '10'

  minio:
    image: pgsty/silo:RELEASE.2026-10-18T00-00-00Z
    container_name: pdfshare-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - pdfshare_data_storage:/data
    networks:
      - pdfshare-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://minio:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '10'

  minio-bucket:
    image: pgsty/mc:RELEASE.2026-10-18T00-00-00Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MC_HOST_pdfshare: http://minioadmin:minioadmin123@minio:9000
    command: ["mb", "--ignore-existing", "pdfshare/${MINIO_BUCKET:-uploads}"]
    networks:
      - pdfshare-net

  minio-config:
    image: pgsty/mc:RELEASE.2026-10-18T00-00-00Z
    depends_on:
      minio-bucket:
        condition: service_completed_successfully
    environment:
      MC_HOST_pdfshare: http://minioadmin:minioadmin123@minio:9000
    command: ["quota", "set", "pdfshare/${MINIO_BUCKET:-uploads}", "--size", "10GB"]
    networks:
      - pdfshare-net

  migrate:
    image: postgres:14-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: pdfshare_password
    volumes:
      - ./migrations/0002_user_consents.sql:/migrations/0002_user_consents.sql:ro
    command: ["psql", "-v", "ON_ERROR_STOP=1", "-h", "postgres", "-U", "pdfshare", "-d", "pdfshare", "-f", "/migrations/0002_user_consents.sql"]
    networks:
      - pdfshare-net

  nginx:
    build: 
      context: .
      dockerfile: nginx/Dockerfile
    container_name: nginx
    depends_on:
      - app
    environment:
      - APP_CONTAINER=app
      - APP_PORT=${PORT:-3000}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.project-a.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.project-a.entrypoints=websecure"
      - "traefik.http.routers.project-a.tls.certresolver=le"
      - "traefik.http.services.project-a.loadbalancer.server.port=80"
      - "traefik.http.routers.project-a.service=project-a"
      - "traefik.docker.network=traefik-public"
    volumes:
      - pdfshare_data_nginx_logs:/var/log/nginx/
      - pdfshare_data_nginx_cache:/var/cache/nginx
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '10'
    restart: always
    networks:
      - pdfshare-net
      - traefik

volumes:
  app_logs:
    driver: local
  pdfshare_data_db:
    driver: local
  pdfshare_data_nginx_logs:
    driver: local
  pdfshare_data_nginx_cache:
    driver: local
  pdfshare_data_storage:
    driver: local


networks:
  pdfshare-net:
    driver: bridge
  traefik-public:
    external: true
